<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSMC Trainer - transcription check</title>
  <!-- KaTeX (math rendering) loaded from a CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    body { font-family: Georgia, serif; max-width: 800px; margin: 0 auto; padding: 16px; line-height: 1.55; color: #222; }
    h1 { font-size: 1.4rem; }
    .q { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin: 20px 0; }
    .q h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .meta { color: #666; font-size: 0.85rem; margin-bottom: 8px; }
    .answer { background: #eef6ee; padding: 6px 10px; border-radius: 6px; margin: 10px 0; }
    img { max-width: 100%; display: block; margin: 8px auto; }
    .credit { font-size: 0.75rem; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 6px; }
    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: bold; }
    .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <h1>Transcription check: 2025 CSMC</h1>
  <p>Compare each question with the PDF. Click "Solution" to open the solution.</p>
  <div id="out">Loading...</div>
  <footer class="credit">Problems &copy; Centre for Education in Mathematics and Computing (CEMC), University of Waterloo.
    <a href="https://cemc.uwaterloo.ca/resources/past-contests">cemc.uwaterloo.ca/resources/past-contests</a></footer>

  <script>
    // Turn the plain text from questions.json into HTML.
    // Math ($...$ and $$...$$) is set aside first so the formatting steps don't break it.
    function format(text) {
      const math = [];
      text = text.replace(/\$\$[\s\S]+?\$\$|\$[^$]+?\$/g, m => { math.push(m); return '@@M' + (math.length - 1) + '@@'; });
      text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      text = text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
      // [[image:path]] marks where a diagram goes
      text = text.replace(/\[\[image:(.+?)\]\]/g, '<img src="$1" alt="diagram">');
      text = text.split(/\n\n+/).map(p => p.startsWith('<img') ? p : '<p>' + p + '</p>').join('');
      // put the math back (escaped so < > & inside math are safe)
      return text.replace(/@@M(\d+)@@/g, (_, i) =>
        math[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
    }

    fetch('data/questions.json')
      .then(r => r.json())
      .then(questions => {
        document.getElementById('out').innerHTML = questions.map(q => `
          <section class="q">
            <h2>${q.id}</h2>
            <div class="meta">Part ${q.part}, Question ${q.number} &middot; topics: ${q.topics.join(', ')}</div>
            ${format(q.question)}
            ${q.image ? `<img src="${q.image}" alt="diagram">` : ''}
            ${q.answer ? `<div class="answer"><b>Answer:</b> ${format(q.answer)}</div>` : ''}
            <details><summary>Solution</summary>${format(q.solution)}</details>
            <div class="credit">Problem &copy; Centre for Education in Mathematics and Computing (CEMC), University of Waterloo.
              <a href="https://cemc.uwaterloo.ca/resources/past-contests">cemc.uwaterloo.ca/resources/past-contests</a></div>
          </section>`).join('');
        // KaTeX renders every math piece on the page
        window.addEventListener('load', () => renderMathInElement(document.body, {
          delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]
        }));
        if (document.readyState === 'complete') renderMathInElement(document.body, {
          delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]
        });
      })
      .catch(e => { document.getElementById('out').textContent = 'Could not load data/questions.json: ' + e; });
  </script>
</body>
</html>
